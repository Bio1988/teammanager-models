name: publish-model-manifest

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Reviewed, successful main commit SHA to publish
        required: true
        type: string

concurrency:
  group: model-manifest-v3-pocket-r3.2-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed main commit without credentials
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Preflight reviewed protected main before handling keys
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -eu
          test "${GITHUB_REF:-}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 scripts/release_protocol.py preflight --api "$FORGEJO_API_URL" --repository "$FORGEJO_REPOSITORY" --expected-sha "$EXPECTED_SOURCE_SHA" --checkout-sha "$(git rev-parse HEAD)"
      - name: Sign, draft, verify, publish, and public-verify immutable assets
        env:
          MODEL_MANIFEST_SIGNING_KEY_B64: ${{ secrets.MODEL_MANIFEST_SIGNING_KEY_B64 }}
          MODEL_MANIFEST_PUBLIC_KEY_B64: ${{ secrets.MODEL_MANIFEST_PUBLIC_KEY_B64 }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -eu
          umask 077
          workdir="$(mktemp -d)"
          cleanup() { rm -rf "$workdir"; }
          trap cleanup EXIT HUP INT TERM

          test -n "$MODEL_MANIFEST_SIGNING_KEY_B64"
          test -n "$MODEL_MANIFEST_PUBLIC_KEY_B64"
          test -n "$FORGEJO_TOKEN"
          test "${GITHUB_REF:-}" = refs/heads/main
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$EXPECTED_SOURCE_SHA"
          python3 scripts/release_protocol.py preflight --api "$FORGEJO_API_URL" --repository "$FORGEJO_REPOSITORY" --expected-sha "$EXPECTED_SOURCE_SHA" --checkout-sha "$commit"

          private_key="$workdir/model-manifest-private.pem"
          public_key="$workdir/model-manifest-public.pem"
          derived_public_key="$workdir/derived-public.pem"
          output="$workdir/output"
          mkdir "$output"
          printf '%s' "$MODEL_MANIFEST_SIGNING_KEY_B64" | base64 --decode > "$private_key"
          chmod 0600 "$private_key"
          printf '%s' "$MODEL_MANIFEST_PUBLIC_KEY_B64" | base64 --decode > "$public_key"
          openssl pkey -in "$private_key" -pubout -out "$derived_public_key"
          cmp "$derived_public_key" "$public_key"

          cp manifest.json "$output/teammanager-model-manifest-v3.json"
          openssl pkeyutl -sign -inkey "$private_key" -rawin -in "$output/teammanager-model-manifest-v3.json" -out "$output/teammanager-model-manifest-v3.json.sig"
          test "$(wc -c < "$output/teammanager-model-manifest-v3.json.sig")" -eq 64
          printf '%s\n' "$(sha256sum "$output/teammanager-model-manifest-v3.json" | awk '{print $1}')" > "$output/teammanager-model-manifest-v3.json.sha256"
          test "$(wc -c < "$output/teammanager-model-manifest-v3.json.sha256")" -eq 65
          python3 scripts/verify_release_manifest.py --manifest "$output/teammanager-model-manifest-v3.json" --signature "$output/teammanager-model-manifest-v3.json.sig" --sha256 "$output/teammanager-model-manifest-v3.json.sha256" --public-key "$public_key"
          python3 scripts/release_protocol.py publish --api "$FORGEJO_API_URL" --server "$FORGEJO_SERVER_URL" --repository "$FORGEJO_REPOSITORY" --expected-sha "$EXPECTED_SOURCE_SHA" --output "$output" --source-manifest manifest.json --public-key "$public_key"
