name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - run: go test ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: git diff --check HEAD~1 HEAD
