name: track-outlines

# Weekly rebuild of the circuit outlines (docs/track-outlines.md). Runs on the AI box, keeps its Geofabrik
# extracts, reference lines and catalogue in a persistent state directory, downloads one region after another
# (unchanged files are skipped by their MD5) and publishes a new release only when the outline geometry
# changed. The Server pins a release explicitly; a new release changes nothing until that pin moves.
on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

concurrency:
  group: track-outlines
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ai-box
    timeout-minutes: 600
    env:
      STATE: /workspace/track-outlines
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check inputs
        run: |
          # catalogue.json (Server track catalogue origins) and lines/ (reference lines) are seeded by the
          # operator, see docs/track-outlines.md; the job refuses to guess them.
          test -s "$STATE/catalogue.json" && test -d "$STATE/lines"
          mkdir -p "$STATE/pbf" "$STATE/cut" "$STATE/out" "$STATE/release"
          test -x "$STATE/venv/bin/python" || { python3 -m venv "$STATE/venv" && "$STATE/venv/bin/pip" install -q osmium==4.3.2; }
      - name: Download, extract, build
        run: |
          py="$STATE/venv/bin/python -B"
          curl -fsS -A "TeamManager-track-outlines/1" -o "$STATE/pbf/index-v1.json" https://download.geofabrik.de/index-v1.json
          $py scripts/osm_extract.py plan --catalogue "$STATE/catalogue.json" --lines "$STATE/lines" --index "$STATE/pbf/index-v1.json" --out "$STATE/plan.json"
          $py scripts/osm_extract.py download --plan "$STATE/plan.json" --out "$STATE/pbf"
          rm -rf "$STATE/cut" "$STATE/out" && mkdir -p "$STATE/cut" "$STATE/out"
          $py scripts/osm_extract.py extract --plan "$STATE/plan.json" --pbf "$STATE/pbf" --out "$STATE/cut"
          $py scripts/track_outlines.py build --catalogue "$STATE/catalogue.json" --lines "$STATE/lines" --osm "$STATE/cut" --out "$STATE/out"
          rm -rf "$STATE/release" && mkdir -p "$STATE/release"
          $py scripts/track_outlines.py bundle --built "$STATE/out" --version "$(date -u +%Y%m%d)" --commit "$GITHUB_SHA" --out "$STATE/release"
      - name: Publish when the geometry changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          new=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["content_sha256"])' "$STATE/release/provenance.json")
          tag=$(curl -fsS "$api/releases?limit=50" | python3 -c 'import json,sys; print(next((r["tag_name"] for r in json.load(sys.stdin) if r["tag_name"].startswith("track-outlines-")), ""))')
          if [ -n "$tag" ]; then
            old=$(curl -fsSL "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/provenance.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("content_sha256", ""))')
            if [ "$old" = "$new" ]; then echo "geometry unchanged since $tag"; exit 0; fi
          fi
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset"][len("track-outlines-"):-len(".zip")])' "$STATE/release/provenance.json")
          body="Circuit outlines and backgrounds for the telemetry map ($(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["tracks"]))' "$STATE/release/provenance.json") tracks). Map data (c) OpenStreetMap contributors, ODbL 1.0. See provenance.json and docs/track-outlines.md. Immutable."
          id=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "target_commitish": sys.argv[2], "name": sys.argv[1], "body": sys.argv[3]}))' "track-outlines-$version" "$GITHUB_SHA" "$body" \
            | curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" --data @- "$api/releases" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in "$STATE"/release/*; do
            curl -fsS -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$id/assets?name=$(basename "$f")" > /dev/null
          done
          echo "published track-outlines-$version"
