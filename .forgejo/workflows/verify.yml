name: verify

on:
  pull_request:
  # The protected-main gate requires this same verification context for a PR
  # branch. Restricting pushes to main makes that required context impossible
  # to satisfy before a merge.
  push:

permissions:
  contents: read

jobs:
  test:
    # The active local Forgejo runner advertises ai-box. The generic
    # ubuntu-latest label selects an unavailable default container image and
    # fails before the verifier can run.
    runs-on: ai-box
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Test deterministic model packaging
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate immutable Alpha build-input records
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path(".")
          json.loads((root / "manifest.json").read_text(encoding="utf-8"))

          readme = " ".join((root / "README.md").read_text(encoding="utf-8").split())
          required_readme = (
              "`teammanager-models` is immutable build-input storage",
              "`build/alpha-models.lock.json`",
              "`model-pack.json` is the local runtime descriptor",
              "does **not** fetch this repository's `manifest.json`",
              "`moonshine-small-streaming-en` a required",
              "Moonshine `moonshine-tiny-streaming-en`",
              "Moonshine `moonshine-medium-streaming-en`",
              "No Whisper model is in the current lock",
              "three required VCTK voice files",
          )
          assert all(text in readme for text in required_readme)
          agents = (root / "AGENTS.md").read_text(encoding="utf-8")
          assert all(asset in agents for asset in (
              "moonshine-small-streaming-en",
              "moonshine-tiny-streaming-en",
              "moonshine-medium-streaming-en",
          ))
          assert "whisper-small-q5_1" not in agents

          lines = (root / "docs" / "alpha-build-inputs.md").read_text(encoding="utf-8").splitlines()
          document = "\n".join(lines)
          current_section = document.split("## Current inventory (model pack alpha-5)", 1)[1].split("\n## Historical first-Alpha inventory", 1)[0]
          current_rows = [line.split("|") for line in current_section.splitlines() if line.startswith("| Required |") or line.startswith("| Optional |")]
          required = [row[2].strip().strip("`") for row in current_rows if row[1].strip() == "Required"]
          optional = [row[2].strip().strip("`") for row in current_rows if row[1].strip() == "Optional"]
          assert required == [
              "pocket-english",
              "pocket-voice-charles",
              "pocket-voice-michael",
              "pocket-voice-eve",
              "moonshine-runtime",
              "moonshine-small-streaming-en",
              "minilm-model",
              "minilm-vocab",
              "minilm-license",
          ]
          assert optional == [
              "moonshine-tiny-streaming-en", "moonshine-medium-streaming-en",
              "distiluse-model", "distiluse-vocab", "distiluse-projection",
              "e5-model", "e5-tokenizer", "e5-license",
              "minilm-l12-model", "minilm-l12-vocab", "minilm-l12-license",
          ]
          assert len(current_rows) == 20
          assert "mirrored as Forgejo release assets" in " ".join(current_section.split())
          for row in current_rows:
              asset_id = row[2].strip().strip("`")
              assert row[3].strip().strip("`").startswith("https://"), asset_id
              assert row[4].strip().strip("`"), asset_id
              assert row[5].strip().isdigit(), asset_id
              assert re.fullmatch(r"[0-9a-f]{64}", row[6].strip().strip("`")), asset_id
              assert row[7].strip(), asset_id

          historical_section = document.split("## Historical first-Alpha inventory", 1)[1].split("\n## Pocket TTS 3.1.0 release provenance", 1)[0]
          historical_rows = [line.split("|") for line in historical_section.splitlines() if line.startswith("| Required |") or line.startswith("| Optional |")]
          historical_required = [row[2].strip().strip("`") for row in historical_rows if row[1].strip() == "Required"]
          historical_optional = [row[2].strip().strip("`") for row in historical_rows if row[1].strip() == "Optional"]
          assert historical_required == [
              "pocket-runtime",
              "pocket-english",
              "pocket-alba",
              "whisper-runtime",
              "whisper-base-q5_1",
          ]
          assert historical_optional == ["whisper-small-q5_1"]
          assert len(historical_rows) == 6

          required_docs = (
              "The table below records the first private TeamManager Alpha only.",
              "No other release asset was a first-Alpha dependency.",
              "and any Whisper model other than the explicitly selected optional\n"
              "`whisper-small-q5_1` were outside that first-Alpha snapshot. The optional Small\n"
              "input could be downloaded only after explicit user action; it was not fetched\n"
              "or selected automatically.",
          )
          assert all(text in document for text in required_docs)

          pocket31_section = document.split("## Pocket TTS 3.1.0 release provenance (2026-09-16)", 1)[1].split("\n## ", 1)[0]
          assert "Race Engineer Alpha 2's closed `build/alpha-models.lock.json` is the authority" in pocket31_section
          assert "does not revise the historical first-Alpha" in pocket31_section
          assert "table or select these assets for an installer." in pocket31_section
          for asset_record in (
              "https://forgejo.g-grp.com/Max/teammanager-models/releases/download/pocket-tts-v3.1.0-r2/pocket-runtime-win-cpu-v3.1.0-r2.zip",
              "https://forgejo.g-grp.com/Max/teammanager-models/releases/download/pocket-tts-v3.1.0-r2/pocket-model-en-config-v3.1.0-r1.zip",
          ):
              assert asset_record in pocket31_section
          assert "278866753" in pocket31_section
          assert "55a11ac8bf1b2662640426aa712f64f6b0551f62d3e7729a1ac35d2c0fcd40ad" in pocket31_section
          assert "739" in pocket31_section
          assert "fe5b3e6b7c5be1c73ba43e05476d0c4b0ad23142cf2035423a6fa9221bf2daf9" in pocket31_section

          moonshine_section = document.split("## Alpha 31 Moonshine increment", 1)[1]
          for asset_id in (
              "moonshine-runtime",
              "moonshine-tiny-streaming-en",
              "moonshine-small-streaming-en",
              "moonshine-medium-streaming-en",
          ):
              assert f"`{asset_id}`" in moonshine_section
          assert "11455945" in moonshine_section
          assert "718dca3a95fd02eeb02f483fa750500a51a24576dc099c507de48af154c48335" in moonshine_section
          assert "Visual C++ redistributable terms" in moonshine_section
          assert "The ZIP has no single umbrella license" in moonshine_section
          assert "these notices do not reclassify TeamManager helper code" in moonshine_section

          case_path = root / "docs" / "archive" / "natural-radio-d1-gold-cases.json"
          result_path = root / "docs" / "archive" / "natural-radio-d1-gold-results.json"
          cases = json.loads(case_path.read_text(encoding="utf-8"))
          result = json.loads(result_path.read_text(encoding="utf-8"))
          assert result["case_file_sha256"] == hashlib.sha256(case_path.read_bytes()).hexdigest()
          assert result["system_instruction"] == cases["system_instruction"]
          assert result["acceptance"] == cases["acceptance"]
          assert result["limits"] == cases["limits"]
          assert len(result["cases"]) == len(cases["cases"])

          forbidden = cases["acceptance"]["forbidden_terms"]
          maximum_words = cases["acceptance"]["maximum_words"]
          passed = []
          for spec, observed in zip(cases["cases"], result["cases"], strict=True):
              assert observed["id"] == spec["id"]
              assert observed["fact"] == spec["fact"]
              assert observed["required_terms"] == spec["required_terms"]
              assert observed["expected_response"] == spec["expected_response"]
              text = observed["response"].strip()
              missing = [term for term in spec["required_terms"] if term.lower() not in text.lower()]
              found_forbidden = [term for term in forbidden if re.search(rf"(?i)(?<![A-Za-z]){re.escape(term)}(?![A-Za-z])", text)]
              words = len(text.split())
              accepted = (
                  observed["finish_reason"] == "stop"
                  and words <= maximum_words
                  and not missing
                  and not found_forbidden
                  and text == spec["expected_response"]
              )
              assert observed["words"] == words
              assert observed["missing_terms"] == missing
              assert observed["forbidden_terms"] == found_forbidden
              assert observed["passed"] is accepted
              passed.append(accepted)
          assert result["passed"] is all(passed)
          PY
