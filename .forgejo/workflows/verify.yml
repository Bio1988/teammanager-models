name: verify

on:
  pull_request:
  # The protected-main gate requires this same verification context for a PR
  # branch. Restricting pushes to main makes that required context impossible
  # to satisfy before a merge.
  push:

permissions:
  contents: read

jobs:
  test:
    # The active local Forgejo runner advertises ai-box. The generic
    # ubuntu-latest label selects an unavailable default container image and
    # fails before the verifier can run.
    runs-on: ai-box
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate immutable Alpha build-input records
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path(".")
          json.loads((root / "manifest.json").read_text(encoding="utf-8"))

          readme = (root / "README.md").read_text(encoding="utf-8")
          required_readme = (
              "`teammanager-models` is immutable build-input storage",
              "`build/alpha-models.lock.json`",
              "`model-pack.json` is the local runtime descriptor",
              "does **not** fetch this repository's `manifest.json`",
          )
          assert all(text in readme for text in required_readme)

          lines = (root / "docs" / "alpha-build-inputs.md").read_text(encoding="utf-8").splitlines()
          rows = [line.split("|") for line in lines if line.startswith("| Required |") or line.startswith("| Optional |")]
          required = [row[2].strip().strip("`") for row in rows if row[1].strip() == "Required"]
          optional = [row[2].strip().strip("`") for row in rows if row[1].strip() == "Optional"]
          assert required == [
              "pocket-runtime",
              "pocket-english",
              "pocket-alba",
              "whisper-runtime",
              "whisper-base-q5_1",
          ]
          assert optional == ["whisper-small-q5_1"]
          assert len(rows) == 6

          required_docs = (
              "These immutable Forgejo release assets are the only model/runtime inputs for",
              "the first private TeamManager Alpha.",
              "No other release asset is a first-Alpha dependency.",
              "and any Whisper model other than the explicitly selected optional\n"
              "`whisper-small-q5_1` must not be selected, fetched, or interpreted by the\n"
              "Alpha runtime. The optional Small input may be downloaded only after explicit\n"
              "user action; it is never fetched or selected automatically.",
          )
          document = "\n".join(lines)
          assert all(text in document for text in required_docs)

          case_path = root / "docs" / "natural-radio-d1-gold-cases.json"
          result_path = root / "docs" / "natural-radio-d1-gold-results.json"
          cases = json.loads(case_path.read_text(encoding="utf-8"))
          result = json.loads(result_path.read_text(encoding="utf-8"))
          assert result["case_file_sha256"] == hashlib.sha256(case_path.read_bytes()).hexdigest()
          assert result["system_instruction"] == cases["system_instruction"]
          assert result["acceptance"] == cases["acceptance"]
          assert result["limits"] == cases["limits"]
          assert len(result["cases"]) == len(cases["cases"])

          forbidden = cases["acceptance"]["forbidden_terms"]
          maximum_words = cases["acceptance"]["maximum_words"]
          passed = []
          for spec, observed in zip(cases["cases"], result["cases"], strict=True):
              assert observed["id"] == spec["id"]
              assert observed["fact"] == spec["fact"]
              assert observed["required_terms"] == spec["required_terms"]
              assert observed["expected_response"] == spec["expected_response"]
              text = observed["response"].strip()
              missing = [term for term in spec["required_terms"] if term.lower() not in text.lower()]
              found_forbidden = [term for term in forbidden if re.search(rf"(?i)(?<![A-Za-z]){re.escape(term)}(?![A-Za-z])", text)]
              words = len(text.split())
              accepted = (
                  observed["finish_reason"] == "stop"
                  and words <= maximum_words
                  and not missing
                  and not found_forbidden
                  and text == spec["expected_response"]
              )
              assert observed["words"] == words
              assert observed["missing_terms"] == missing
              assert observed["forbidden_terms"] == found_forbidden
              assert observed["passed"] is accepted
              passed.append(accepted)
          assert result["passed"] is all(passed)
          PY
