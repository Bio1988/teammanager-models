name: publish-alpha-channel

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Current reviewed, successful protected main SHA
        required: true
        type: string
      race_release_tag:
        description: Immutable Forgejo Race Engineer release tag
        required: true
        type: string
      race_asset_name:
        description: Exact immutable Race Engineer release asset file name
        required: true
        type: string
      race_size_bytes:
        description: Exact Race Engineer release asset size in bytes
        required: true
        type: string
      race_sha256:
        description: Exact lowercase SHA-256 of the Race Engineer release asset
        required: true
        type: string
      relay_release_tag:
        description: Immutable Forgejo Relay release tag
        required: true
        type: string
      relay_asset_name:
        description: Exact immutable Relay release asset file name
        required: true
        type: string
      relay_size_bytes:
        description: Exact Relay release asset size in bytes
        required: true
        type: string
      relay_sha256:
        description: Exact lowercase SHA-256 of the Relay release asset
        required: true
        type: string

concurrency:
  group: teammanager-alpha-channel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # This label must be assigned only to the separately administered signing-custody runner.
    runs-on: alpha-channel-custody
    steps:
      - name: Preflight protected main before handling secrets or release metadata
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TRUSTED_SHA: ${{ forgejo.sha }}
          CANONICAL_REPOSITORY: Max/teammanager-models
          CANONICAL_REF: refs/heads/main
          CANONICAL_ORIGIN: https://forgejo.g-grp.com
        run: |
          set -eu
          test "${FORGEJO_REPOSITORY:-}" = "$CANONICAL_REPOSITORY"
          test "${FORGEJO_REF:-}" = "$CANONICAL_REF"
          test "${FORGEJO_SHA:-}" = "$EXPECTED_SOURCE_SHA"
          test "${FORGEJO_SERVER_URL:-}" = "$CANONICAL_ORIGIN"
          test "${FORGEJO_API_URL:-}" = "$CANONICAL_ORIGIN/api/v1"
          test "$TRUSTED_SHA" = "$EXPECTED_SOURCE_SHA"
          branch="$(mktemp)"; status="$(mktemp)"; trap 'rm -f "$branch" "$status"' EXIT HUP INT TERM
          curl --fail --silent --show-error "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/branches/main" > "$branch"
          curl --fail --silent --show-error "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/commits/$EXPECTED_SOURCE_SHA/status" > "$status"
          python3 - "$EXPECTED_SOURCE_SHA" "$branch" "$status" <<'PY'
          import json, re, sys
          expected, branch_path, status_path = sys.argv[1:]
          branch = json.load(open(branch_path, encoding="utf-8"))
          status = json.load(open(status_path, encoding="utf-8"))
          contexts = branch.get("status_check_contexts")
          if re.fullmatch(r"[0-9a-f]{40}", expected) is None:
              raise SystemExit("expected_source_sha must be lowercase SHA-1")
          if branch.get("protected") is not True:
              raise SystemExit("main must be protected")
          if not isinstance(branch.get("required_approvals"), int) or branch["required_approvals"] < 1:
              raise SystemExit("main must require approval")
          if branch.get("enable_status_check") is not True or not isinstance(contexts, list) or not contexts:
              raise SystemExit("main must require named status contexts")
          if not isinstance(branch.get("commit"), dict) or branch["commit"].get("id") != expected:
              raise SystemExit("expected SHA is not current main")
          if status.get("sha") != expected or status.get("state") != "success":
              raise SystemExit("expected SHA does not have a successful combined status")
          latest = {row.get("context"): row.get("status") for row in status.get("statuses", []) if isinstance(row, dict)}
          if not all(latest.get(context) == "success" for context in contexts):
              raise SystemExit("a required status context is not successful")
          PY
      - name: Check out the exact reviewed main SHA without credentials
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify dedicated custody runner and immutable release assets
        env:
          ALPHA_CHANNEL_CUSTODY_RUNNER_ID: ${{ secrets.ALPHA_CHANNEL_CUSTODY_RUNNER_ID }}
          ALPHA_CHANNEL_PUBLISH_TOKEN: ${{ secrets.ALPHA_CHANNEL_PUBLISH_TOKEN }}
          RACE_RELEASE_TAG: ${{ inputs.race_release_tag }}
          RACE_ASSET_NAME: ${{ inputs.race_asset_name }}
          RACE_SIZE_BYTES: ${{ inputs.race_size_bytes }}
          RACE_SHA256: ${{ inputs.race_sha256 }}
          RELAY_RELEASE_TAG: ${{ inputs.relay_release_tag }}
          RELAY_ASSET_NAME: ${{ inputs.relay_asset_name }}
          RELAY_SIZE_BYTES: ${{ inputs.relay_size_bytes }}
          RELAY_SHA256: ${{ inputs.relay_sha256 }}
        run: |
          set -eu
          test -n "$ALPHA_CHANNEL_CUSTODY_RUNNER_ID"
          test "$RUNNER_NAME" = "$ALPHA_CHANNEL_CUSTODY_RUNNER_ID"
          test -n "$ALPHA_CHANNEL_PUBLISH_TOKEN"
          workdir="$(mktemp -d)"; trap 'rm -rf "$workdir"' EXIT HUP INT TERM
          export ALPHA_CHANNEL_PUBLISH_TOKEN
          python3 - "$workdir" <<'PY'
          import hashlib, json, os, pathlib, re, sys, urllib.parse, urllib.request
          root = pathlib.Path(sys.argv[1])
          token = os.environ["ALPHA_CHANNEL_PUBLISH_TOKEN"]
          rows = (
              ("race-engineer-go", os.environ["RACE_RELEASE_TAG"], os.environ["RACE_ASSET_NAME"], os.environ["RACE_SIZE_BYTES"], os.environ["RACE_SHA256"]),
              ("teammanager-relay", os.environ["RELAY_RELEASE_TAG"], os.environ["RELAY_ASSET_NAME"], os.environ["RELAY_SIZE_BYTES"], os.environ["RELAY_SHA256"]),
          )
          sha = re.compile(r"[0-9a-f]{64}\Z")
          for repo, tag, name, size_text, expected_sha in rows:
              if not tag or not name or "/" in name or not sha.fullmatch(expected_sha):
                  raise SystemExit("invalid immutable release identity input")
              try:
                  expected_size = int(size_text)
              except ValueError as error:
                  raise SystemExit("asset size must be an integer") from error
              if expected_size <= 0:
                  raise SystemExit("asset size must be positive")
              api = f"https://forgejo.g-grp.com/api/v1/repos/Max/{repo}/releases/tags/{urllib.parse.quote(tag, safe='')}"
              request = urllib.request.Request(api, headers={"Authorization": f"token {token}"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
              if release.get("tag_name") != tag or release.get("draft") or release.get("prerelease"):
                  raise SystemExit("release must be a published non-prerelease exact tag")
              assets = release.get("assets")
              asset = next((item for item in assets if isinstance(item, dict) and item.get("name") == name), None) if isinstance(assets, list) else None
              if asset is None or asset.get("size") != expected_size:
                  raise SystemExit("release asset name or size differs from declared immutable input")
              url = f"https://forgejo.g-grp.com/Max/{repo}/releases/download/{tag}/{name}"
              if asset.get("browser_download_url") != url:
                  raise SystemExit("release asset URL is not the canonical immutable Forgejo URL")
              request = urllib.request.Request(url, headers={"Authorization": f"token {token}"})
              with urllib.request.urlopen(request, timeout=300) as response:
                  data = response.read()
              if len(data) != expected_size or hashlib.sha256(data).hexdigest() != expected_sha:
                  raise SystemExit("downloaded immutable release asset does not match declared bytes")
          PY
          unset ALPHA_CHANNEL_PUBLISH_TOKEN
      - name: Build sign and verify the fixed Alpha channel
        env:
          MODEL_MANIFEST_SIGNING_KEY_B64: ${{ secrets.MODEL_MANIFEST_SIGNING_KEY_B64 }}
          MODEL_MANIFEST_PUBLIC_KEY_B64: ${{ secrets.MODEL_MANIFEST_PUBLIC_KEY_B64 }}
          RACE_RELEASE_TAG: ${{ inputs.race_release_tag }}
          RACE_ASSET_NAME: ${{ inputs.race_asset_name }}
          RACE_SIZE_BYTES: ${{ inputs.race_size_bytes }}
          RACE_SHA256: ${{ inputs.race_sha256 }}
          RELAY_RELEASE_TAG: ${{ inputs.relay_release_tag }}
          RELAY_ASSET_NAME: ${{ inputs.relay_asset_name }}
          RELAY_SIZE_BYTES: ${{ inputs.relay_size_bytes }}
          RELAY_SHA256: ${{ inputs.relay_sha256 }}
        run: |
          set -eu
          test -n "$MODEL_MANIFEST_SIGNING_KEY_B64"; test -n "$MODEL_MANIFEST_PUBLIC_KEY_B64"
          workdir="$(mktemp -d)"; output="$RUNNER_TEMP/alpha-channel"; trap 'rm -rf "$workdir"' EXIT HUP INT TERM
          rm -rf "$output"; mkdir -p "$output"
          private_key="$workdir/private.pem"; public_key="$workdir/public.pem"; derived="$workdir/derived-public.pem"
          printf '%s' "$MODEL_MANIFEST_SIGNING_KEY_B64" | base64 --decode > "$private_key"; unset MODEL_MANIFEST_SIGNING_KEY_B64
          chmod 0600 "$private_key"
          printf '%s' "$MODEL_MANIFEST_PUBLIC_KEY_B64" | base64 --decode > "$public_key"; unset MODEL_MANIFEST_PUBLIC_KEY_B64
          openssl pkey -in "$private_key" -pubout -out "$derived"; cmp "$derived" "$public_key"
          python3 scripts/alpha_channel.py build --output "$output/alpha.json" --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --race-engineer-go-release-tag "$RACE_RELEASE_TAG" --race-engineer-go-asset-name "$RACE_ASSET_NAME" --race-engineer-go-size-bytes "$RACE_SIZE_BYTES" --race-engineer-go-sha256 "$RACE_SHA256" \
            --teammanager-relay-release-tag "$RELAY_RELEASE_TAG" --teammanager-relay-asset-name "$RELAY_ASSET_NAME" --teammanager-relay-size-bytes "$RELAY_SIZE_BYTES" --teammanager-relay-sha256 "$RELAY_SHA256"
          openssl pkeyutl -sign -inkey "$private_key" -rawin -in "$output/alpha.json" -out "$output/alpha.json.sig"
          rm -f "$private_key"
          python3 scripts/alpha_channel.py verify --channel "$output/alpha.json" --signature "$output/alpha.json.sig" --public-key "$public_key"
      - name: Atomically update only the fixed Alpha channel
        env:
          ALPHA_CHANNEL_PUBLISH_TOKEN: ${{ secrets.ALPHA_CHANNEL_PUBLISH_TOKEN }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -eu
          test -n "$ALPHA_CHANNEL_PUBLISH_TOKEN"
          publish="$(mktemp -d)"; trap 'rm -rf "$publish"' EXIT HUP INT TERM
          git -c http.extraHeader="Authorization: token $ALPHA_CHANNEL_PUBLISH_TOKEN" clone --no-checkout https://forgejo.g-grp.com/Max/teammanager-models.git "$publish"
          cd "$publish"
          git -c http.extraHeader="Authorization: token $ALPHA_CHANNEL_PUBLISH_TOKEN" fetch --depth=1 origin main
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          mkdir -p channels
          cp "$RUNNER_TEMP/alpha-channel/alpha.json" channels/alpha.json
          cp "$RUNNER_TEMP/alpha-channel/alpha.json.sig" channels/alpha.json.sig
          git add -- channels/alpha.json channels/alpha.json.sig
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'channels/alpha.json'
          git diff --cached --name-only | grep -Fx 'channels/alpha.json.sig'
          git -c user.name='TeamManager Alpha Channel Custody' -c user.email='alpha-channel-custody@forgejo.g-grp.com' commit -m 'release(models): update Alpha channel'
          git -c http.extraHeader="Authorization: token $ALPHA_CHANNEL_PUBLISH_TOKEN" push origin HEAD:refs/heads/main
          unset ALPHA_CHANNEL_PUBLISH_TOKEN
