name: sign-model-manifest-candidate

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Reviewed, successful main commit SHA to sign
        required: true
        type: string

concurrency:
  group: model-manifest-v3-pocket-r3.2-candidate
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight reviewed protected main before handling keys
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          TRUSTED_SHA: ${{ forgejo.sha }}
        run: |
          set -eu
          test "${GITHUB_REF:-}" = refs/heads/main
          test "${GITHUB_SHA:-}" = "$EXPECTED_SOURCE_SHA"
          test "$TRUSTED_SHA" = "$EXPECTED_SOURCE_SHA"
          branch="$(mktemp)"; status="$(mktemp)"; trap 'rm -f "$branch" "$status"' EXIT HUP INT TERM
          curl --fail --silent --show-error "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/branches/main" > "$branch"
          curl --fail --silent --show-error "$FORGEJO_API_URL/repos/$FORGEJO_REPOSITORY/commits/$EXPECTED_SOURCE_SHA/status" > "$status"
          python3 - "$EXPECTED_SOURCE_SHA" "$branch" "$status" <<'PY'
          import json, re, sys
          expected, branch_path, status_path = sys.argv[1:]
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require(re.fullmatch(r"[0-9a-f]{40}", expected) is not None, "expected_source_sha must be lowercase SHA-1")
          branch = json.load(open(branch_path, encoding="utf-8"))
          contexts = branch.get("status_check_contexts")
          require(isinstance(branch, dict) and branch.get("protected") is True, "main must be protected")
          require(isinstance(branch.get("required_approvals"), int) and branch["required_approvals"] >= 1, "main must require approval")
          require(branch.get("enable_status_check") is True, "main must require status checks")
          require(isinstance(contexts, list) and contexts and all(isinstance(item, str) and item for item in contexts), "invalid required status contexts")
          require(isinstance(branch.get("commit"), dict) and branch["commit"].get("id") == expected, "expected SHA is not current main")
          status = json.load(open(status_path, encoding="utf-8"))
          require(isinstance(status, dict) and status.get("sha") == expected and status.get("state") == "success", "combined status is not successful for expected SHA")
          rows = status.get("statuses")
          require(isinstance(rows, list) and all(isinstance(row, dict) for row in rows), "invalid status context response")
          latest = {row.get("context"): row.get("status") for row in rows}
          require(all(latest.get(context) == "success" for context in contexts), "required status check is not successful")
          PY
      - name: Check out the preflighted trusted main SHA without credentials
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Sign and locally verify immutable candidate assets
        env:
          MODEL_MANIFEST_SIGNING_KEY_B64: ${{ secrets.MODEL_MANIFEST_SIGNING_KEY_B64 }}
          MODEL_MANIFEST_PUBLIC_KEY_B64: ${{ secrets.MODEL_MANIFEST_PUBLIC_KEY_B64 }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -eu
          umask 077
          workdir="$(mktemp -d)"; output="$RUNNER_TEMP/model-manifest-candidate"
          rm -rf "$output"; mkdir "$output"
          cleanup() { rm -rf "$workdir"; }
          trap cleanup EXIT HUP INT TERM
          unset FORGEJO_TOKEN GITEA_TOKEN GITHUB_TOKEN
          test -n "$MODEL_MANIFEST_SIGNING_KEY_B64"; test -n "$MODEL_MANIFEST_PUBLIC_KEY_B64"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          private_key="$workdir/private.pem"; public_key="$workdir/public.pem"; derived_public_key="$workdir/derived-public.pem"
          printf '%s' "$MODEL_MANIFEST_SIGNING_KEY_B64" | base64 --decode > "$private_key"; unset MODEL_MANIFEST_SIGNING_KEY_B64
          chmod 0600 "$private_key"
          printf '%s' "$MODEL_MANIFEST_PUBLIC_KEY_B64" | base64 --decode > "$public_key"; unset MODEL_MANIFEST_PUBLIC_KEY_B64
          openssl pkey -in "$private_key" -pubout -out "$derived_public_key"; cmp "$derived_public_key" "$public_key"
          cp manifest.json "$output/teammanager-model-manifest-v3.json"
          openssl pkeyutl -sign -inkey "$private_key" -rawin -in "$output/teammanager-model-manifest-v3.json" -out "$output/teammanager-model-manifest-v3.json.sig"
          rm -f "$private_key"
          test "$(wc -c < "$output/teammanager-model-manifest-v3.json.sig")" -eq 64
          sha256sum "$output/teammanager-model-manifest-v3.json" | awk '{print $1}' > "$output/teammanager-model-manifest-v3.json.sha256"
          python3 scripts/verify_release_manifest.py --manifest "$output/teammanager-model-manifest-v3.json" --signature "$output/teammanager-model-manifest-v3.json.sig" --sha256 "$output/teammanager-model-manifest-v3.json.sha256" --public-key "$public_key"
          python3 - "$output" "$EXPECTED_SOURCE_SHA" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          output, source_sha = Path(sys.argv[1]), sys.argv[2]
          names = ("teammanager-model-manifest-v3.json", "teammanager-model-manifest-v3.json.sig", "teammanager-model-manifest-v3.json.sha256")
          assets = [{"name": name, "sha256": hashlib.sha256((output / name).read_bytes()).hexdigest(), "size_bytes": (output / name).stat().st_size} for name in names]
          (output / "candidate-evidence.json").write_text(json.dumps({"contract": "teammanager-model-manifest-v3-pocket-r3.2", "source_sha": source_sha, "assets": assets, "signature_verified": True, "publication": {"status": "not-attempted", "reason": "This workflow has no tag, release, or repository-write step; external signing-custody authorization is required before publication."}}, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Retain signed candidate evidence
        uses: https://data.forgejo.org/actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: model-manifest-v3-pocket-r3.2-candidate-${{ inputs.expected_source_sha }}
          path: ${{ runner.temp }}/model-manifest-candidate
          if-no-files-found: error
