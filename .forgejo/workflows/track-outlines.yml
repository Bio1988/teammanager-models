name: track-outlines

# Weekly rebuild of the circuit outlines (docs/track-outlines.md). Runs on the AI box runner (label ai-box,
# registered as ai-box:host: jobs run directly in the runner container, which PR jobs share). It keeps its
# Geofabrik extracts, reference lines and catalogue in the persistent host directory /workspace/track-outlines, downloads one region after another
# (unchanged files are skipped by their MD5) and publishes a new release only when the outline geometry
# changed. The Server pins a release explicitly; a new release changes nothing until that pin moves.
on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

concurrency:
  group: track-outlines
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ai-box
    timeout-minutes: 600
    env:
      STATE: /workspace/track-outlines
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check inputs
        run: |
          # catalogue.json (Server track catalogue origins) and lines/ (reference lines) are seeded by the
          # operator, see docs/track-outlines.md; the job refuses to guess them.
          test -s "$STATE/catalogue.json" && test -d "$STATE/lines"
          mkdir -p "$STATE/pbf" "$STATE/cut" "$STATE/out" "$STATE/release"
          test -x "$STATE/venv/bin/python" || { python3 -m venv "$STATE/venv" && "$STATE/venv/bin/pip" install -q osmium==4.3.2; }
      - name: Download, extract, build
        run: |
          py="$STATE/venv/bin/python -B"
          curl -fsS -A "TeamManager-track-outlines/1" -o "$STATE/pbf/index-v1.json" https://download.geofabrik.de/index-v1.json
          $py scripts/osm_extract.py plan --catalogue "$STATE/catalogue.json" --lines "$STATE/lines" --index "$STATE/pbf/index-v1.json" --out "$STATE/plan.json"
          $py scripts/osm_extract.py download --plan "$STATE/plan.json" --out "$STATE/pbf"
          rm -rf "$STATE/cut" "$STATE/out" && mkdir -p "$STATE/cut" "$STATE/out"
          $py scripts/osm_extract.py extract --plan "$STATE/plan.json" --pbf "$STATE/pbf" --out "$STATE/cut"
          $py scripts/track_outlines.py build --catalogue "$STATE/catalogue.json" --lines "$STATE/lines" --osm "$STATE/cut" --out "$STATE/out"
          rm -rf "$STATE/release" && mkdir -p "$STATE/release"
          $py scripts/track_outlines.py bundle --built "$STATE/out" --version "$(date -u +%Y%m%d)" --commit "$GITHUB_SHA" --out "$STATE/release" --min-coverage 0.9
      - name: Publish when the geometry changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          prov="$STATE/release/provenance.json"
          field() { python3 -c 'import json,sys; v=json.load(open(sys.argv[1]))[sys.argv[2]]; print(v if isinstance(v, str) else json.dumps(v))' "$1" "$2"; }
          tag=$(curl -fsS "$api/releases?limit=50" | python3 -c 'import json,sys; print(next((r["tag_name"] for r in json.load(sys.stdin) if r["tag_name"].startswith("track-outlines-") and not r["draft"]), ""))')
          if [ -n "$tag" ]; then
            curl -fsSL -o "$STATE/previous.json" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/provenance.json"
            if [ "$(field "$STATE/previous.json" content_sha256)" = "$(field "$prov" content_sha256)" ]; then echo "geometry unchanged since $tag"; exit 0; fi
            # never publish a bundle that lost tracks the Server may already serve from the previous release
            python3 -c 'import json,sys; old=set(json.load(open(sys.argv[1]))["tracks"]); new=set(json.load(open(sys.argv[2]))["tracks"]); lost=sorted(old-new); sys.exit(f"tracks missing against the previous release: {lost}" if lost else 0)' "$STATE/previous.json" "$prov"
          fi
          version=$(field "$prov" asset); version=${version#track-outlines-}; version=${version%.zip}
          body="Circuit outlines and backgrounds for the telemetry map ($(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["tracks"]))' "$prov") tracks). Map data (c) OpenStreetMap contributors, ODbL 1.0. Archive SHA-256 $(field "$prov" sha256). See provenance.json and docs/track-outlines.md. Immutable."
          # draft first, all assets, then publish: a failure leaves no half release behind
          id=$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "target_commitish": sys.argv[2], "name": sys.argv[1], "body": sys.argv[3], "draft": True}))' "track-outlines-$version" "$GITHUB_SHA" "$body" \
            | curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" --data @- "$api/releases" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          trap 'curl -fsS -X DELETE -H "Authorization: token $TOKEN" "$api/releases/$id" || true; curl -fsS -X DELETE -H "Authorization: token $TOKEN" "$api/tags/track-outlines-$version" || true' ERR
          for f in "$STATE"/release/*; do
            curl -fsS -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$id/assets?name=$(basename "$f")" > /dev/null
          done
          curl -fsS -X PATCH -H "Authorization: token $TOKEN" -H "Content-Type: application/json" --data '{"draft":false}' "$api/releases/$id" > /dev/null
          echo "published track-outlines-$version"
